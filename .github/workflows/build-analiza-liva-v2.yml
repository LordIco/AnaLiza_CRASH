name: Build AnaLiza LIVA v2 APK

on:
  push:
    branches:
      - chatgpt-analiza-liva-apk-v2-mockup

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-liva-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AnaLiza-Server-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnaLiza-Server-v2-APK
          path: android-liva-v2/AnaLiza-Server-v2.0.0.apk
          retention-days: 7
